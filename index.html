<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Yuwen Chen">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      color: #333;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #1e3a8a;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: 60%;
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      font-size: 1.1em;
    }

    th {
      background-color: #e0e7ff;
    }

    #contacts {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Welcome to Your Contact Slots!</h1>
  <p>Below is your list of contacts.</p>

  <div id="contacts"></div>

  <script>
    const names = ["Arnold", "Sly", "Dwayne", "Vin", "JCVD", "Steven"];

    let html = "<table><tr><th>Slot #</th><th>Name</th></tr>";
    for (let i = 0; i < names.length; i++) {
      html += `<tr><td>${i}</td><td>${names[i]}</td></tr>`;
    }
    html += "</table>";
    document.getElementById("contacts").innerHTML = html;

    let continueSearching = true;

    while (continueSearching) {
      let slotInput = prompt("Which contact would you like to view? Please enter a Slot Number (0 to 5):");

      if (slotInput === null) {
        alert("No input received. Thanks for stopping by!");
        break;
      }

      const slot = parseInt(slotInput);

      if (!isNaN(slot) && slot >= 0 && slot < names.length) {
        alert(`You selected ${names[slot]}.`);
      } else {
        alert("That name was not found. Please try again.");
        continue;
      }

      const again = prompt("Would you like to search for another name? Yes or No?");
      if (!again || again.toLowerCase() !== "yes") {
        continueSearching = false;
        alert("Thanks for exploring your contact list!");
      }
    }
  </script>

</body>
</html>
